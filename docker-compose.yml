services:
  ai-telemetry:
    build: ./ai-telemetry
    container_name: cfo-ai-telemetry
    volumes:
      - ./ai-telemetry/data/frames:/srv/data/frames:ro
      - ./ai-telemetry/data/weights:/srv/data/weights:ro
    ports:
      - "8000:8000"
    environment:
      AI_HTTP_ADDR: 0.0.0.0:8000
      AI_EMIT_TO_BACKEND: http://backend:8080/api/v1/telemetry
      AI_SIM_LOOP_INTERVAL_SECONDS: 2
      AI_MODE: ${AI_MODE:-simulated}
      AI_HF_MODEL_ID: ${AI_HF_MODEL_ID:-yolo11n}
      HF_TOKEN: ${HF_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [cfo-net]

  backend:
    build: ./backend
    container_name: cfo-backend
    ports:
      - "8080:8080"
    environment:
      BACKEND_HTTP_ADDR: :8080
      BACKEND_ZONE_TOPOLOGY: ${BACKEND_ZONE_TOPOLOGY:-CONCOURSE_A,BAG_CHECK,E_PIER,GATE_A,GATE_B,PLATFORM_1,PLATFORM_2,SECURITY_T1,SECURITY_T2}
    depends_on:
      ai-telemetry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [cfo-net]

  frontend:
    build:
      context: ./frontend
      # NEXT_PUBLIC_* is inlined at build time; pass it through so the
      # running container's API base matches the host port.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: cfo-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      backend:
        condition: service_healthy
    networks: [cfo-net]

networks:
  cfo-net:
    driver: bridge
